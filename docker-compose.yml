services:
  # API PHP
  app-eduino-api:
    build: .
    container_name: api-eduino-php
    ports:
      - "8081:80"
    environment:
      DB_HOST: db_eduino
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      - db_eduino
    volumes:
      - ./api:/var/www/html
      - ./app/public/fotos:/var/www/html/fotos
    networks:
      - eduino_network

  # Base de datos MySQL
  db_eduino:
    image: mysql:8.0
    container_name: eduino_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_eduino_data:/var/lib/mysql
      - ./baseDatos:/docker-entrypoint-initdb.d
    ports:
      - "3309:3306"
    networks:
      - eduino_network

  # Frontend React (Vite)
  app-eduino-frontend:
    image: node:20-alpine
    container_name: frontend-eduino
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - app-eduino-api
    networks:
      - eduino_network

volumes:
  db_eduino_data:

networks:
  eduino_network:
    driver: bridge